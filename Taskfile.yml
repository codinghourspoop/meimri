version: "3"

tasks:
  dev:
    desc: Run Vite dev server and Go API with air in parallel
    cmds:
      - task dev:frontend &
      - air
    deps: [frontend:install]

  dev:frontend:
    desc: Vite dev server with /api proxy to :8080
    dir: frontend
    cmds:
      - bun --bun run dev

  dev:api:
    desc: Go API only (Vite proxies /api here)
    cmds:
      - air

  build:
    desc: Production build (frontend bundle + Go binary)
    cmds:
      - task frontend:build
      - go build -o ./tmp/main ./cmd/server

  frontend:install:
    desc: Install frontend dependencies with bun
    dir: frontend
    cmds:
      - bun install

  frontend:build:
    desc: Build Svelte frontend into static/dist
    dir: frontend
    deps: [frontend:install]
    cmds:
      - bun --bun run build

  migrate:
    desc: Run goose migrations (sqlite3 dialect — Turso is SQLite-compatible)
    cmds:
      - goose -dir db/migrations sqlite3 "${DATABASE_URL:-./data/app.db}" up

  migrate:down:
    cmds:
      - goose -dir db/migrations sqlite3 "${DATABASE_URL:-./data/app.db}" down
