version: "3"

tasks:
  dev:
    desc: Run
    cmds:
      - task dev:frontend &
      - dotenvx run -- air
    deps: [frontend:install]

  dev:frontend:
    desc: Vite
    dir: frontend
    cmds:
      - bun --bun run dev

  dev:api:
    desc: Go backend
    cmds:
      - dotenvx run -- air

  build:
    desc: Production
    cmds:
      - task frontend:build
      - go build -o ./tmp/main ./cmd/server

  frontend:install:
    desc: Install deps
    dir: frontend
    cmds:
      - bun install

  frontend:build:
    desc: Build frontend
    dir: frontend
    deps: [frontend:install]
    cmds:
      - bun --bun run build

  migrate:
    desc: Run  migrations
    cmds:
      - dotenvx run -- sh -c 'goose -dir db/migrations sqlite3 "${DATABASE_URL:-./data/app.db}" up'

  migrate:down:
    cmds:
      - dotenvx run -- sh -c 'goose -dir db/migrations sqlite3 "${DATABASE_URL:-./data/app.db}" down'
